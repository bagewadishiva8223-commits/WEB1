<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar 2</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .nav-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 75px;
            background-color: #717882;

        }
        .left{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 30%;
        }
        .right{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 20%;

        }
        button{
            padding: 10px;
            background-color: #717882;
            color: white;
            border: 1px solid white;
        }
        input{
            padding: 10px;
            width: 200px;
            color: white;
            /* background-color: #717882; */
            border: 1px solid white;
        }

       

        
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="left">
            <h1>Brand</h1>
            <h1>Home</h1>
            <h1>About</h1>
            <h1>Product</h1>
        </div>
        <div class="right">
            <input type="text" placeholder="search">
            <button>Search</button>
        </div>
    </div>
</body>
</html>
