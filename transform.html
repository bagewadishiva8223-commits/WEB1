<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            display: flex;
            /* justify-content: space-evenly;
            align-items: center; */
        }

        .ani{
            height: 5px;
            width: 5px;
            border: 2px solid black;
            animation: change 1s linear infinite;
        }

        @keyframes change{
            0%{
                background-color: red;
            }
            100%{
                background-color: blue;
            }
        }
        
        
        .box{
            height: 50px;
            width: 100px;
            border: 2px solid black;
        }
        img{
            width: 50px;
            height: 50px;
            background-color: aquamarine;
            transition: transform 3s ease;
            border-radius: 50%;
        }
        img:hover{
            transform: rotate(360deg)
        }
    </style>
</head>
<body>
    <div class="box1">
    <div class="ani"></div>
    <div class="ani"></div>
    </div>
    <div class="box">
        <!-- <img src="https://www.nicepng.com/png/full/254-2547288_share-car-without-wheels-png.png" alt=""> -->
    </div>
    <img  height="300px" width="300px"  src="https://www.shutterstock.com/image-photo/car-wheel-alloy-colour-black-600nw-2236414949.jpg" alt="">
    <img  height="300px" width="300px"  src="https://www.shutterstock.com/image-photo/car-wheel-alloy-colour-black-600nw-2236414949.jpg" alt="">
    
</body>
</html>
