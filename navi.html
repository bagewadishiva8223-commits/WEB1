<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .nav-bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* height: 75px; */
            background-color: #5f4c4c;
            color: white;
            
        }
        
        img{
            mix-blend-mode: multiply;
        }


        .right{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 30%;
        }
    </style>
</head>
<body>
    <div class="nav-bar">

        <div class="left">
            <img height="80px"   src="https://i.pinimg.com/736x/5e/f7/e4/5ef7e4d1131f087ddf4d8f41787a05ab.jpg" alt="">
        </div>

        <div class="middle">
            <input type="text" placeholder="search">
        </div>

        <div class="right">
            <h1>signup</h1>
            <h1>login</h1>
        </div>
    </div>
</body>
</html>
