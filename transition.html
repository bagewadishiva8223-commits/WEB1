<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        nav {
            height: 75px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background-color: #787878;
        }
        .outer{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            background-color: azure;
            height: 400px;
            
        }
        .box{
            height: 200px;
            width: 200px;
            /* border: 1px solid black; */
            background-color: white;
            transition: all 0.6s ease 0s;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border-radius: 10%;
            box-shadow: 0px 0px 50px #787878;
        }
        /* img{
            height: 200px;
            width: 200px;
        } */
        .box:hover{
            height: 250px;
            width: 250px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <nav>
        <h2>head</h2>
        <h2>head</h2>
        <h2>head</h2>
        <h2>head</h2>
        <h2>head</h2>
    </nav>
    <div class="outer">
        <div class="box">
            <img height="200px" width="200px"  src="https://cloud.starkinsider.com/wp-content/uploads/2020/03/1997-BMW-logo.webp" alt="">
        </div>
        <div class="box">
            <img height="200px" width="200px" src="https://cloud.starkinsider.com/wp-content/uploads/2020/03/1997-BMW-logo.webp" alt="">
        </div>
    </div>
</body>
</html>
