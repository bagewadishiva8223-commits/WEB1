<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        body{
            background: powderblue;
        }
        *{
            padding: 0;
            margin: 0;
        }


        .navi{
            background-color: black;
            height: 75px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;

        }
        h1{
            color: white;
        }

        .box{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            margin-top: 40px;
        }
        img{
            height: 350px;
            width: 400px;
            transition: transform 1.5s linear;
            /* border: 2px solid black; */
            /* border-radius: 10%; */
        }
        .inside{
            /* border: 2px solid black; */
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0px 0px 20px black;
            background-color: white;
            transition: transform 0.4s ease-in 0s;
        }

        .inside:hover{
            transform: scale(1.04);
        }
        button{
            margin-bottom: 20px;
        }
        
        input{
            height: 30px;
            width: 200px;
            transition: transform 0.4s linear 0s;
        }
        input:hover{
            transform: scale(1.09);
        }

        button{
            background-color: black;
            color: white;
            height: 30px;
            width: 185px;
            border-radius: 8px ;
            margin-top: 10px;
            transition: transform 0.3s linear 0s;
        }
        button:hover{
            transform: scale(1.09);
        }

        img:hover{
            transform: translateX(100px) ;

        }

  
        /* #main{
            height: 75px;
        } */
    </style>
</head>
<body>
    <nav class="navi">
        <!-- <img id="main" src="https://mir-s3-cdn-cf.behance.net/project_modules/1400/c916dc6258361.58e3c9c7ebea2.jpg" alt=""> -->
         <h1>Uber</h1>
    </nav>
    <div class="box">
        <div class="inside">
        <img src="https://shop.yamaha-motor-india.com/cdn/shop/files/METALLIC_SILVER_CYAN_1200x.webp?v=1754026443" alt=""><br>
        <center><input type="text" placeholder="Enter KM"></center>
        <center><button>Book now</button></center>
        </div>
        <div class="inside">
        <img src="https://cdn.bajajauto.com/-/media/bajaj-auto/new-webp/3-wheeler/savings_calculator_image_re_new.webp" alt=""><br>
        <center><input type="text" placeholder="Enter KM"></center>
        <center><button>Book now</button></center>
        </div>
        <div class="inside">
        <img src="https://www.mbusa.com/content/dam/mb-nafta/us/myco/my24/eqe-class/sedan/all-vehicles/2024-EQE350-4M-SEDAN-AVP-DR.png" alt=""><br>
        <center><input type="text" placeholder="Enter KM"></center>
        <center><button>Book now</button></center>
        </div>
    </div>
</body>
</html>
